<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humidité Casa</title>
  <link rel="stylesheet" href="css/historique.css">
</head>
<body data-metric="humidity">
  <main>
    <nav class="pages" aria-label="Pages">
      <a href="index.html">Température</a>
      <a href="humidity.html" aria-current="page">Humidité</a>
      <a href="thermostat.html">Thermostat</a>
    </nav>
    <section class="carte">
      <div class="entete">
        <div class="selecteur">
        <button type="button" class="fleche" id="pieces-gauche" aria-label="Pièces précédentes">‹</button>
        <div class="pieces" id="pieces" role="group" aria-label="Pièce"></div>
        <button type="button" class="fleche" id="pieces-droite" aria-label="Pièces suivantes">›</button>
      </div>
        <div class="jour">
          <button type="button" id="precedent" aria-label="Jour précédent">‹</button>
          <input type="date" id="jour" aria-label="Jour">
          <button type="button" id="suivant" aria-label="Jour suivant">›</button>
        </div>
      </div>
      <div class="valeur" id="valeur" aria-live="polite"></div>
      <div id="graphique"></div>
      <dl class="stats" id="stats"></dl>
      <div class="legende" id="legende"></div>
    </section>
  </main>
  <script src="js/pieces.js"></script>
  <script src="js/historique.js"></script>
</body>
</html>
