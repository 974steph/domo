<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermostat Casa</title>
  <link rel="stylesheet" href="css/historique.css">
  <link rel="stylesheet" href="css/thermostat.css">
</head>
<body>
  <main>
    <nav class="pages" aria-label="Pages">
      <a href="index.html">Température</a>
      <a href="humidity.html">Humidité</a>
      <a href="thermostat.html" aria-current="page">Thermostat</a>
    </nav>
    <section class="carte thermostat">
      <div class="selecteur">
        <button type="button" class="fleche" id="pieces-gauche" aria-label="Pièces précédentes">‹</button>
        <div class="pieces" id="pieces" role="group" aria-label="Pièce"></div>
        <button type="button" class="fleche" id="pieces-droite" aria-label="Pièces suivantes">›</button>
      </div>
      <div class="cadran" id="cadran">
        <div class="mesure" aria-live="polite">
          <span class="entier" id="entier">–</span><span class="decimale" id="decimale"></span><span class="unite">°C</span>
        </div>
        <div class="pied"><span class="etat-clim" id="marche"></span><span id="consigne"></span></div>
      </div>
      <div class="maj" id="maj"></div>
    </section>
  </main>
  <script src="js/pieces.js"></script>
  <script src="js/thermostat.js"></script>
</body>
</html>
